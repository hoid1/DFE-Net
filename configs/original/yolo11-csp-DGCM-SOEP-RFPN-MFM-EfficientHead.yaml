# 三改进点组合配置
#   改进点1：自研 CSP-DGCM —— 全部 C3k2 -> C3k2_Block + DGCM 内核（8 处）
#   改进点2：自研 SOEP + 二次创新 RFPN+MFM（SPDConv 注入 P2 + CSPOmniKernel + SNI 上采样 + GSConvE 下采样 + MFM 取代全部 Concat）
#   改进点3：自研 Efficient 轻量检测头（原创性：自研）
# 基线：improve/csp-block/yolo11-csp-DGCM.yaml + legacy0526/neck/yolo11/yolo11-SOEP-RFPN-MFM.yaml
# 注意：C3k2 -> C3k2_Block 后 parse_model 不再自动关闭 legacy，必须显式 legacy: False
# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
legacy: False
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_Block, [256, {'module': DGCM}, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_Block, [512, {'module': DGCM}, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_Block, [512, {'module': DGCM}, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_Block, [1024, {'module': DGCM}, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, SNI, [2]]
  - [[-1, 6], 1, MFM, [1024]] # cat backbone P4
  - [-1, 2, C3k2_Block, [512, {'module': DGCM}, False]] # 13

  - [-1, 1, SNI, [2]]
  - [2, 1, SPDConv, [256]] # 15 (P3/8-small)
  - [[-1, -2, 4], 1, MFM, [512]]  # cat backbone P3
  - [-1, 1, CSPOmniKernel, []] # 17
  - [-1, 2, C3k2_Block, [256, {'module': DGCM}, False]] # 18 (P3/8-small)

  - [-1, 1, GSConvE, [256, 3, 2]]
  - [[-1, 13], 1, MFM, [256]] # cat head P4
  - [-1, 2, C3k2_Block, [512, {'module': DGCM}, False]] # 21 (P4/16-medium)

  - [-1, 1, GSConvE, [512, 3, 2]]
  - [[-1, 10], 1, MFM, [512]] # cat head P5
  - [-1, 2, C3k2_Block, [1024, {'module': DGCM}, True]] # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect_Efficient, [nc]] # Detect(P3, P4, P5)
